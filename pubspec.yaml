name: medicamentos_app
description: App de consulta de medicamentos para personal de enfermería
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter

  drift: 2.21.0
  drift_flutter: 0.2.4
  sqlite3_flutter_libs: ^0.5.0

  supabase_flutter: ^2.5.0

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^14.2.0

  speech_to_text: ^7.0.0

  uuid: ^4.4.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.1
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: 2.21.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/